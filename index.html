<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Santhosh Jewellers</title>  
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="header">
    <div class="logo">Santhosh Jewellers</div>
    <div class="social">
      <a href="#"><img src="facebook.png" alt="Facebook"></a>
      <a href="#"><img src="instagram.png" alt="Instagram"></a>
    </div>
  </div>

  <div class="main-section">
    <div class="grid">
      <div class="tile tile1">Home</div>
      <div class="tile tile2">Jewels</div>
      <div class="tile tile3">Contacts</div>
    </div>

    <div class="center-title">
      <h1>Santhosh <span>J</span>ewellers</h1>
      <p>Since 1984</p>
    </div>

    <div class="grid">
      <div class="tile tile4">Story</div>
      <div class="tile tile5">Style</div>
      <div class="tile tile6">Method</div>
    </div>
  </div>
</body>

</html>
